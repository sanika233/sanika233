<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020b18" />
      <stop offset="50%" stop-color="#05152d" />
      <stop offset="100%" stop-color="#01060f" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#0e2a4a" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Left Side: QA Badge -->
  <g transform="translate(45, 40)">
    <text x="0" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="#00d2ff" filter="url(#glow)">{QA}</text>
    <text x="0" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="#ffffff">{QA}</text>
    <g transform="translate(0, 115)" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7fa0c7">
      <text x="24" y="0">🎯 Quality Focused</text>
      <text x="24" y="24">⚡ Automation Driven</text>
      <text x="24" y="48">📈 Results Oriented</text>
      <text x="24" y="72">💡 Continuous Learner</text>
    </g>
  </g>

  <!-- Center Header: Name & Title -->
  <g transform="translate(260, 45)">
    <text x="0" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="1">SANIKA BHALEKAR</text>
    
    <!-- Title with Dots -->
    <circle cx="10" cy="85" r="4" fill="#00d2ff" />
    <line x1="25" y1="85" x2="445" y2="85" stroke="#0072ff" stroke-width="2" />
    <circle cx="460" cy="85" r="4" fill="#00d2ff" />
    <text x="235" y="89" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#00d2ff" letter-spacing="3" text-anchor="middle">QA AUTOMATION ENGINEER</text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a4c2e6">
      Specializing in robust, maintainable <tspan fill="#00d2ff" font-weight="700">automation frameworks (POM &amp; BDD)</tspan>
    </text>
    <text x="0" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a4c2e6">
      delivering reliable software quality across enterprise platforms.
    </text>

    <!-- Tech Stack Badges -->
    <g transform="translate(0, 168)">
      <!-- Python -->
      <rect x="0" y="0" width="58" height="34" rx="8" fill="#0a2244" stroke="#0072ff" stroke-width="1.2" />
      <text x="29" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00d2ff" text-anchor="middle">PYTHON</text>

      <!-- Selenium -->
      <rect x="68" y="0" width="68" height="34" rx="8" fill="#0a2244" stroke="#0072ff" stroke-width="1.2" />
      <text x="102" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">SELENIUM</text>

      <!-- Pytest -->
      <rect x="146" y="0" width="58" height="34" rx="8" fill="#0a2244" stroke="#0072ff" stroke-width="1.2" />
      <text x="175" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00d2ff" text-anchor="middle">PYTEST</text>

      <!-- BDD -->
      <rect x="214" y="0" width="48" height="34" rx="8" fill="#0a2244" stroke="#0072ff" stroke-width="1.2" />
      <text x="238" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">BDD</text>

      <!-- SQL -->
      <rect x="272" y="0" width="48" height="34" rx="8" fill="#0a2244" stroke="#0072ff" stroke-width="1.2" />
      <text x="296" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00d2ff" text-anchor="middle">SQL</text>

      <!-- Postman -->
      <rect x="330" y="0" width="68" height="34" rx="8" fill="#0a2244" stroke="#0072ff" stroke-width="1.2" />
      <text x="364" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">POSTMAN</text>

      <!-- Jenkins -->
      <rect x="408" y="0" width="64" height="34" rx="8" fill="#0a2244" stroke="#0072ff" stroke-width="1.2" />
      <text x="440" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00d2ff" text-anchor="middle">JENKINS</text>

      <!-- Git -->
      <rect x="482" y="0" width="45" height="34" rx="8" fill="#0a2244" stroke="#0072ff" stroke-width="1.2" />
      <text x="504" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">GIT</text>
    </g>
  </g>

  <!-- Right Side: Graphic & Contact Details -->
  <g transform="translate(810, 45)">
    <!-- Screen Outer -->
    <rect x="40" y="15" width="280" height="175" rx="10" fill="#030c1a" stroke="#0072ff" stroke-width="3" filter="url(#glow)" />
    <rect x="40" y="15" width="280" height="175" rx="10" fill="#030c1a" stroke="#00d2ff" stroke-width="1.5" />
    
    <!-- Code Lines inside Laptop Screen -->
    <line x1="60" y1="38" x2="150" y2="38" stroke="#ff5f56" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="52" x2="200" y2="52" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" />
    <line x1="75" y1="66" x2="170" y2="66" stroke="#4cd964" stroke-width="3" stroke-linecap="round" />
    <line x1="75" y1="80" x2="230" y2="80" stroke="#7fa0c7" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="94" x2="140" y2="94" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" />
    <line x1="75" y1="108" x2="185" y2="108" stroke="#ffbd2e" stroke-width="3" stroke-linecap="round" />
    
    <!-- Verified Badge on Screen -->
    <rect x="230" y="32" width="70" height="45" rx="6" fill="#0a2244" stroke="#4cd964" stroke-width="1.5" />
    <path d="M250 55 L262 67 L285 42" fill="none" stroke="#4cd964" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Laptop Base -->
    <path d="M10 195 L350 195 L330 205 L30 205 Z" fill="#0a2244" stroke="#0072ff" stroke-width="1.5" />
    <rect x="150" y="196" width="60" height="4" rx="2" fill="#00d2ff" />

    <!-- Magnifying Glass with Bug Indicator -->
    <g transform="translate(205, 120)">
      <circle cx="45" cy="45" r="32" fill="#05152d" stroke="#00d2ff" stroke-width="3" filter="url(#glow)" />
      <circle cx="45" cy="45" r="32" fill="#05152d" stroke="#00d2ff" stroke-width="2" />
      <line x1="68" y1="68" x2="100" y2="100" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" />
      
      <!-- Bug Icon -->
      <ellipse cx="45" cy="46" rx="10" ry="12" fill="#ffffff" />
      <circle cx="45" cy="32" r="6" fill="#ffffff" />
      <!-- Bug Legs -->
      <path d="M35 40 L25 36 M35 46 L23 46 M35 52 L25 56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <path d="M55 40 L65 36 M55 46 L67 46 M55 52 L65 56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Contact Info Below Graphic -->
    <g transform="translate(20, 222)" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a4c2e6">
      <g transform="translate(0, 0)">
        <text x="0" y="0">📍 Pune / Mumbai, India</text>
      </g>
      <g transform="translate(0, 19)">
        <text x="0" y="0">✉️ Mahagaonkarsanika@gmail.com</text>
      </g>
      <g transform="translate(0, 38)">
        <text x="0" y="0">🔗 linkedin.com/in/sanikabhalekar/</text>
      </g>
    </g>
  </g>

  <!-- Bottom Slogan Ribbon -->
  <g transform="translate(45, 290)">
    <rect x="0" y="0" width="750" height="42" rx="8" fill="#041226" stroke="#0072ff" stroke-width="1.2" />
    <g font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      <text x="125" y="26" fill="#00d2ff">⚙️ AUTOMATING TODAY</text>
      <line x1="250" y1="10" x2="250" y2="32" stroke="#0e3360" stroke-width="1.5" />
      <text x="375" y="26" fill="#ffffff">🛡️ ASSURING QUALITY</text>
      <line x1="500" y1="10" x2="500" y2="32" stroke="#0e3360" stroke-width="1.5" />
      <text x="625" y="26" fill="#00d2ff">🚀 DELIVERING TOMORROW</text>
    </g>
  </g>
</svg>
